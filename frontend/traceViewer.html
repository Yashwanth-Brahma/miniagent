<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniagent · trace viewer</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --panel-2: #1b232d;
    --line: #263140;
    --ink: #e6edf3;
    --ink-dim: #8b98a5;
    --ink-faint: #5b6672;
    --tool: #4aa3df;      /* a step that called a tool */
    --final: #3fb950;     /* a terminal step (end_turn) */
    --error: #f0883e;     /* a step that errored */
    --tail: #d2a8ff;      /* highlight for the slow tail */
    --grid: #1f2730;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 32px 28px 80px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .mono { font-family: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace; }

  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  h1 { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  h1 span { color: var(--ink-faint); font-weight: 400; }
  .sub { color: var(--ink-dim); font-size: 13px; }

  /* stat strip */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 24px 0 8px; }
  .stat { background: var(--panel); padding: 14px 16px; }
  .stat .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .stat .v small { font-size: 13px; color: var(--ink-dim); font-weight: 400; margin-left: 2px; }
  .stat .k { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .stat.accent .v { color: var(--tail); }

  .note { color: var(--ink-faint); font-size: 12px; margin: 10px 2px 0; }

  /* legend */
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 26px 2px 10px; font-size: 12px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  /* runs */
  .run { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; overflow: hidden; }
  .run-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 13px; }
  .run-head .id { color: var(--ink-dim); }
  .run-head .id b { color: var(--ink); font-weight: 600; }
  .run-head .totals { color: var(--ink-dim); display: flex; gap: 16px; }
  .run-head .totals b { color: var(--ink); font-weight: 600; }

  .step { display: grid; grid-template-columns: 34px 118px 1fr 82px; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
  .step:last-child { border-bottom: none; }
  .step .n { color: var(--ink-faint); text-align: right; }
  .step .tool { color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .tool.final { color: var(--final); }
  .step .lat { text-align: right; color: var(--ink); }
  .step .lat.tail { color: var(--tail); font-weight: 600; }

  .track { position: relative; height: 20px; background: var(--grid); border-radius: 4px; }
  .bar { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; min-width: 3px; transition: width .5s cubic-bezier(.2,.7,.2,1); cursor: default; }
  .bar.tool  { background: var(--tool); }
  .bar.final { background: var(--final); }
  .bar.error { background: var(--error); }

  /* empty state */
  .drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 48px 24px; text-align: center; margin-top: 28px; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--tool); background: var(--panel); }
  .drop h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .drop p { color: var(--ink-dim); font-size: 13px; margin-bottom: 16px; }
  .drop code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; color: var(--tail); }
  .btn { display: inline-block; background: var(--tool); color: #06121c; font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 8px; cursor: pointer; border: none; }
  .btn:hover { filter: brightness(1.08); }
  input[type=file] { display: none; }

  /* tooltip */
  #tip { position: fixed; pointer-events: none; background: #05070a; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; opacity: 0; transition: opacity .1s; z-index: 10; white-space: nowrap; }
  #tip .row { display: flex; justify-content: space-between; gap: 18px; }
  #tip .row span:first-child { color: var(--ink-dim); }
  #tip .row span:last-child { color: var(--ink); }

  .reload { font-size: 12px; color: var(--tool); cursor: pointer; background: none; border: none; }
  .reload:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>miniagent <span>/ trace viewer</span></h1>
  <div class="sub" id="source">no trace loaded</div>
</header>

<div id="app"></div>

<div id="tip"></div>
<input type="file" id="file" accept=".jsonl,.json,.txt">

<script>
const COLORS = { tool: 'tool', final: 'final', error: 'error' };

function parseSpans(text) {
  const spans = [];
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    try { spans.push(JSON.parse(t)); } catch (e) { /* skip bad line */ }
  }
  return spans;
}

function percentile(values, p) {
  if (!values.length) return 0;
  const s = [...values].sort((a, b) => a - b);
  const k = (s.length - 1) * (p / 100);
  const lo = Math.floor(k), hi = Math.min(lo + 1, s.length - 1);
  return s[lo] + (s[hi] - s[lo]) * (k - lo);
}

function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : Math.round(ms) + 'ms'; }
function fmtCost(c) { return '$' + c.toFixed(4); }

function render(spans) {
  const app = document.getElementById('app');
  if (!spans.length) { renderEmpty(); return; }

  // group by run_id, preserving first-seen order
  const runs = new Map();
  for (const s of spans) {
    if (!runs.has(s.run_id)) runs.set(s.run_id, []);
    runs.get(s.run_id).push(s);
  }

  const latencies = spans.map(s => s.latency_ms);
  const p50 = percentile(latencies, 50), p95 = percentile(latencies, 95);
  const maxLat = Math.max(...latencies);            // shared scale for all bars
  const costPerRun = [...runs.values()].map(r => r.reduce((a, s) => a + (s.cost || 0), 0));
  const stepsPerRun = [...runs.values()].map(r => r.length);
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;

  // stat strip
  let html = `<div class="stats">
    <div class="stat"><div class="v mono">${fmtMs(p50)}</div><div class="k">latency p50 (typical)</div></div>
    <div class="stat accent"><div class="v mono">${fmtMs(p95)}</div><div class="k">latency p95 (slow tail)</div></div>
    <div class="stat"><div class="v mono">${fmtMs(maxLat)}</div><div class="k">latency max</div></div>
    <div class="stat"><div class="v mono">${fmtCost(avg(costPerRun))}</div><div class="k">cost / task (avg)</div></div>
    <div class="stat"><div class="v mono">${avg(stepsPerRun).toFixed(1)}</div><div class="k">steps / task (avg)</div></div>
    <div class="stat"><div class="v mono">${spans.length}<small>/ ${runs.size} runs</small></div><div class="k">steps recorded</div></div>
  </div>`;

  if (runs.size < 20) {
    html += `<div class="note">Small sample (${runs.size} runs) — percentiles are directional, not statistically solid. Run 50+ tasks for confident numbers.</div>`;
  }

  html += `<div class="legend">
    <span><i style="background:var(--tool)"></i>tool step</span>
    <span><i style="background:var(--final)"></i>final answer</span>
    <span><i style="background:var(--error)"></i>error</span>
    <span><i style="background:var(--tail)"></i>slow tail (&ge; p95)</span>
    <span>bar width = latency, shared scale across all runs</span>
  </div>`;

  // one waterfall per run
  for (const [runId, steps] of runs) {
    const total = steps.reduce((a, s) => a + s.latency_ms, 0);
    const cost = steps.reduce((a, s) => a + (s.cost || 0), 0);
    html += `<div class="run">
      <div class="run-head">
        <span class="id">run <b class="mono">${runId}</b></span>
        <span class="totals">
          <span><b class="mono">${fmtMs(total)}</b> total</span>
          <span><b class="mono">${fmtCost(cost)}</b></span>
          <span><b class="mono">${steps.length}</b> steps</span>
        </span>
      </div>`;
    for (const s of steps) {
      const isError = !!s.error;
      const isFinal = s.stop_reason === 'end_turn' && !isError;
      const cls = isError ? 'error' : (isFinal ? 'final' : 'tool');
      const isTail = s.latency_ms >= p95 && runs.size >= 3;
      const w = Math.max(2, (s.latency_ms / maxLat) * 100);
      const label = isError ? 'error' : (s.tool_calls && s.tool_calls.length ? s.tool_calls.join(', ') : (isFinal ? 'end_turn' : '—'));
      const tokens = (s.input_tokens || 0) + '→' + (s.output_tokens || 0);
      html += `<div class="step">
        <span class="n mono">${s.step}</span>
        <span class="tool ${isFinal ? 'final' : ''}">${label}</span>
        <div class="track">
          <div class="bar ${cls}" style="width:${w}%"
               data-lat="${fmtMs(s.latency_ms)}" data-tok="${tokens}"
               data-cost="${fmtCost(s.cost || 0)}" data-stop="${s.stop_reason || '—'}"
               data-tool="${label}"></div>
        </div>
        <span class="lat mono ${isTail ? 'tail' : ''}">${fmtMs(s.latency_ms)}</span>
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div style="margin-top:22px"><button class="reload" onclick="document.getElementById('file').click()">load a different spans.jsonl</button></div>`;
  app.innerHTML = html;
  document.getElementById('source').textContent = `${spans.length} steps · ${runs.size} runs`;
  wireTooltips();
}

function wireTooltips() {
  const tip = document.getElementById('tip');
  document.querySelectorAll('.bar').forEach(bar => {
    bar.addEventListener('mousemove', e => {
      tip.innerHTML = `
        <div class="row"><span>tool</span><span>${bar.dataset.tool}</span></div>
        <div class="row"><span>latency</span><span>${bar.dataset.lat}</span></div>
        <div class="row"><span>tokens in→out</span><span>${bar.dataset.tok}</span></div>
        <div class="row"><span>cost</span><span>${bar.dataset.cost}</span></div>
        <div class="row"><span>stop_reason</span><span>${bar.dataset.stop}</span></div>`;
      tip.style.opacity = '1';
      const pad = 14;
      let x = e.clientX + pad, y = e.clientY + pad;
      if (x + 200 > window.innerWidth) x = e.clientX - 200;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
    bar.addEventListener('mouseleave', () => { tip.style.opacity = '0'; });
  });
}

function renderEmpty() {
  document.getElementById('app').innerHTML = `
    <div class="drop" id="drop">
      <h2>Drop your <code>spans.jsonl</code> here</h2>
      <p>Or pick the file. It stays in your browser — nothing is uploaded.</p>
      <button class="btn" onclick="document.getElementById('file').click()">Choose file</button>
    </div>`;
  const drop = document.getElementById('drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => render(parseSpans(reader.result));
  reader.readAsText(file);
}

document.getElementById('file').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

// whole-page drag/drop even after data is loaded
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

// try to auto-load if served over http (won't work from file:// — falls back to empty state)
fetch('traces/spans.jsonl')
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(t => render(parseSpans(t)))
  .catch(() => renderEmpty());
</script>
</body>
</html>
